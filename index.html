<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI-Based Fake Identity & Document Screening System | Border Security Prototype</title>
    <meta name="description" content="Professional AI-assisted border document screening and identity verification prototype. Automated neural OCR, Error Level Analysis (ELA) tampering detection, 68-point facial biometrics, and watchlist screening." />
    
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300d8f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/></svg>" />
  </head>
  <body class="bg-[#081426] text-slate-100 antialiased selection:bg-[#2874f0] selection:text-white">
    <div id="root"></div>

    <!-- Smart Auto-Detector: If opened directly via file://, automatically redirect to active server -->
    <script>
      (function() {
        if (window.location.protocol === 'file:') {
          var targetUrl = 'http://localhost:5173';
          
          function checkAndRedirect() {
            fetch(targetUrl, { mode: 'no-cors' })
              .then(function() {
                window.location.replace(targetUrl);
              })
              .catch(function() {
                // Server not ready yet, render helpful launcher
                var root = document.getElementById('root');
                if (root && !document.getElementById('launcher-notice')) {
                  root.innerHTML = [
                    '<div id="launcher-notice" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#070d18;font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',Roboto,sans-serif;color:#f8fafc;padding:24px;">',
                    '  <div style="max-width:520px;width:100%;background:#0f172a;border:1px solid #1e293b;border-radius:16px;padding:32px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.7);text-align:center;">',
                    '    <div style="font-size:48px;margin-bottom:12px;">🛡️</div>',
                    '    <h1 style="font-size:21px;font-weight:700;color:#38bdf8;margin-bottom:8px;letter-spacing:-0.02em;">AI Border Security Screening System</h1>',
                    '    <p style="color:#94a3b8;font-size:14px;line-height:1.6;margin-bottom:24px;">This is a React & Vite web application. To display the interactive interface, the local server must be started.</p>',
                    '    <div style="background:#1e293b;border:1px solid #334155;border-radius:12px;padding:18px;text-align:left;margin-bottom:24px;font-size:14px;color:#e2e8f0;line-height:1.8;">',
                    '      <div style="font-weight:600;color:#38bdf8;margin-bottom:6px;">⚡ Quick 1-Click Launch:</div>',
                    '      1. Open folder: <code style="background:#0b1120;padding:2px 6px;border-radius:4px;font-size:12px;color:#a5f3fc;">Desktop\\New folder</code><br/>',
                    '      2. Double-click <b style="color:#4ade80;">START_PROJECT.bat</b><br/>',
                    '      3. Keep that window open. <i>This page will automatically switch to the website once started!</i>',
                    '    </div>',
                    '    <div style="display:inline-flex;align-items:center;gap:10px;padding:10px 18px;background:rgba(56,189,248,0.1);border:1px solid rgba(56,189,248,0.25);border-radius:30px;color:#38bdf8;font-size:13px;font-weight:500;">',
                    '      <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#38bdf8;"></span>',
                    '      Listening for server on http://localhost:5173...',
                    '    </div>',
                    '  </div>',
                    '</div>'
                  ].join('');
                }
              });
          }

          checkAndRedirect();
          // Auto-poll every 1.5s so when user double clicks START_PROJECT.bat, page switches automatically!
          setInterval(checkAndRedirect, 1500);
        }
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
